<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none" aria-label="The Flat Set  Kraft Box Print Mark">
  <!-- Minimalist Kraft Box Stamp with 6-Slab Identity -->
  <rect x="2" y="2" width="116" height="116" rx="2" stroke="#1A1C1D" stroke-width="2.5" />
  <!-- Brand Header inside stamp -->
  <text x="60" y="24" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="7.5" font-weight="700" letter-spacing="0.14em" fill="#1A1C1D">THE FLAT SET</text>
  <line x1="16" y1="30" x2="104" y2="30" stroke="#1A1C1D" stroke-width="1" />
  <!-- Six Slabs Icon -->
  <rect x="25" y="40" width="70" height="4" fill="#1A1C1D" />
  <rect x="25" y="48" width="70" height="4" fill="#1A1C1D" />
  <rect x="25" y="56" width="70" height="4" fill="#1A1C1D" />
  <rect x="25" y="64" width="70" height="4" fill="#1A1C1D" />
  <rect x="25" y="72" width="70" height="4" fill="#1A1C1D" />
  <rect x="25" y="80" width="64.5" height="4" fill="#1A1C1D" />
  <line x1="16" y1="92" x2="104" y2="92" stroke="#1A1C1D" stroke-width="1" />
  <!-- Footer Tagline inside stamp -->
  <text x="60" y="104" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="6.5" font-weight="600" letter-spacing="0.1em" fill="#1A1C1D">6 BOXES · WHOLE HOME</text>
</svg>
