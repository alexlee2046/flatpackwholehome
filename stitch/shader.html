<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1.0" name="viewport"/>
<title>MODULIV — Design Lab: Shader Study</title>
<script src="vendor/tailwind.js"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
  </style>
</head>
<body>
<!-- Design Lab minimal overlay -->
<div class="fixed top-4 left-4 z-50 flex flex-wrap gap-2">
<a class="bg-black/60 text-white text-[12px] font-semibold tracking-[0.05em] px-4 py-2 rounded-full backdrop-blur-sm border border-white/20" href="index.html">← MODULIV</a>
<a class="bg-black/60 text-white text-[12px] font-semibold tracking-[0.05em] px-4 py-2 rounded-full backdrop-blur-sm border border-white/20" href="three-js.html">3D Snap-Joint Study</a>
</div>
<!-- STITCH_SHADER_START:ANIMATION_15 class="fixed inset-0 w-full h-full" -->
<div class="fixed inset-0 w-full h-full" style="display:block;">
<canvas id="shader-canvas-ANIMATION_15" style="display:block;width:100%;height:100%"></canvas>
<script>
(function() {
  const canvas = document.getElementById('shader-canvas-ANIMATION_15');

  // Sync the WebGL drawing-buffer size with the CSS-driven layout size.
  // This fires on initial layout and whenever the element is resized.
  function syncSize() {
    const w = canvas.clientWidth  || 1280;
    const h = canvas.clientHeight || 720;
    if (canvas.width !== w || canvas.height !== h) {
      canvas.width  = w;
      canvas.height = h;
    }
  }
  if (typeof ResizeObserver !== 'undefined') {
    new ResizeObserver(syncSize).observe(canvas);
  }
  syncSize();

  const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
  if (!gl) {
    canvas.parentNode.innerHTML = '<p style="padding:24px;color:#54433c">3D preview unavailable on this device.</p>';
    return;
  }
  const vs = `attribute vec2 a_position;
varying vec2 v_texCoord;
void main() {
  v_texCoord = a_position * 0.5 + 0.5;
  gl_Position = vec4(a_position, 0.0, 1.0);
}`;
  const fs = `precision highp float;
varying vec2 v_texCoord;
uniform float u_time;
uniform vec2 u_resolution;

void main() {
    vec2 uv = v_texCoord;
    
    // Smooth flowing motion representing compressed foam and ocean voyages
    float flow = 0.5 + 0.5 * sin(uv.x * 3.0 + u_time * 0.5 + uv.y * 2.0);
    float flow2 = 0.5 + 0.5 * cos(uv.y * 4.0 - u_time * 0.3 + uv.x * 1.5);
    
    // Warm, editorial colors from the design system (#f9f9fa, #a85f3b)
    vec3 color1 = vec3(0.976, 0.976, 0.98); // surface
    vec3 color2 = vec3(0.659, 0.373, 0.231); // primary/accent
    
    vec3 finalColor = mix(color1, color2, (flow * flow2) * 0.15);
    
    gl_FragColor = vec4(finalColor, 1.0);
}`;
  function cs(type, src) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    return s;
  }
  const prog = gl.createProgram();
  gl.attachShader(prog, cs(gl.VERTEX_SHADER, vs));
  gl.attachShader(prog, cs(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(prog);
  gl.useProgram(prog);
  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
  const pos = gl.getAttribLocation(prog, 'a_position');
  gl.enableVertexAttribArray(pos);
  gl.vertexAttribPointer(pos, 2, gl.FLOAT, false, 0, 0);
  const uTime = gl.getUniformLocation(prog, 'u_time');
  const uRes = gl.getUniformLocation(prog, 'u_resolution');
  const uMouse = gl.getUniformLocation(prog, 'u_mouse');

  // u_mouse is in pixel coordinates matching u_resolution (ShaderToy convention).
  // Shaders that need normalized coords should use: u_mouse / u_resolution.
  let mouse = { x: canvas.width / 2, y: canvas.height / 2 };
  window.addEventListener('mousemove', (event) => {
    const rect = canvas.getBoundingClientRect();
    if (rect.width && rect.height) {
      const nx = (event.clientX - rect.left) / rect.width;
      const ny = 1.0 - (event.clientY - rect.top) / rect.height;
      mouse.x = nx * canvas.width;
      mouse.y = ny * canvas.height;
    }
  });

  function frame(t) {
    if (typeof ResizeObserver === 'undefined') syncSize();
    gl.viewport(0, 0, canvas.width, canvas.height);
    if (uTime) gl.uniform1f(uTime, t * 0.001);
    if (uRes) gl.uniform2f(uRes, canvas.width, canvas.height);
    if (uMouse) gl.uniform2f(uMouse, mouse.x, mouse.y);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  }

  /* Pause rAF when tab hidden or canvas offscreen; static frame under reduced motion */
  const reduced = matchMedia('(prefers-reduced-motion: reduce)');
  let raf = null;
  function loop(t) { frame(t); raf = requestAnimationFrame(loop); }
  function start() { if (raf === null && !document.hidden) raf = requestAnimationFrame(loop); }
  function stop() { if (raf !== null) { cancelAnimationFrame(raf); raf = null; } }
  new IntersectionObserver(e => e[0].isIntersecting ? start() : stop()).observe(canvas);
  document.addEventListener('visibilitychange', () => document.hidden ? stop() : start());
  if (reduced.addEventListener) reduced.addEventListener('change', () => reduced.matches ? (stop(), frame(0)) : start());
  reduced.matches ? frame(0) : start();
})();
</script>
</div>
<!-- STITCH_SHADER_END:ANIMATION_15 -->
</body>
</html>
